name: Docs validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-and-build:
    # GitHub does not expose repository secrets to pull requests from forks.
    # Skipping those runs prevents untrusted code from ever receiving the API key.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONVISO_API_KEY: ${{ secrets.CONVISO_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn --immutable

      - name: Generate GraphQL documentation
        run: yarn doc

      - name: Verify project context example
        run: grep -q 'scopeIdEq' docs/api/graphql/documentation/operations/queries/projects.mdx

      - name: Build documentation
        run: yarn build

      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation-preview
          path: |
            build/api
            build/assets/js
            build/assets/css
            build/assets/files
            build/img/favicon.ico
            build/img/logo.svg
          retention-days: 7
